<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFlow Live | Pro3 Cloud IDE</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- JSZip Library for Folder Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Xterm Terminal CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.css">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.js"></script>
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
</head>
<body class="dark-theme"> 
    <div class="repl-container">
        <!-- Top Navigation Bar -->
        <nav class="navbar">
            <div class="nav-left">
                <div class="logo-wrapper">
                    <i data-lucide="code-2" class="logo-icon"></i>
                </div>
                <div class="project-info">
                    <span class="project-name">CodeFlow Live</span>
                    <span class="version-badge">v5.3 Pro</span>
                </div>
            </div>

            <div class="nav-center">
                <button class="run-btn" onclick="executeCode()" title="Run Code (Ctrl + Enter)">
                    <i data-lucide="play" class="btn-icon"></i> 
                    <span>Run Project</span>
                </button>
            </div>

            <div class="nav-right">
                <button onclick="togglePanel('preview-frame-container')" class="action-btn active" id="btn-preview" title="Toggle Preview Pane">
                    <i data-lucide="layout-template"></i> 
                    <span>Preview</span>
                </button>
                <button onclick="togglePanel('terminal-pane')" class="action-btn active" id="btn-terminal" title="Toggle Terminal">
                    <i data-lucide="terminal"></i> 
                    <span>Terminal</span>
                </button>
                <div class="divider-v"></div>
                <button onclick="toggleTheme()" class="action-btn theme-btn" id="theme-toggle-btn" title="Switch Theme">
                    <i data-lucide="sun" id="theme-icon"></i>
                </button>
                <button onclick="downloadCurrentFile()" class="action-btn download-btn" title="Download Active File">
                    <i data-lucide="file-down"></i>
                </button>
                <button onclick="downloadProjectZip()" class="action-btn zip-btn" title="Download Entire Project (ZIP)">
                    <i data-lucide="folder-archive"></i>
                    <span>Export ZIP</span>
                </button>
            </div>
        </nav>

        <!-- Main Workspace Body -->
        <div class="repl-workspace">
            <!-- Activity Sidebar -->
            <aside class="activity-bar">
                <div class="act-group-top">
                    <button class="act-icon active" id="toggle-sidebar" title="File Explorer">
                        <i data-lucide="files"></i>
                    </button>
                    <button class="act-icon" title="Search Workspace">
                        <i data-lucide="search"></i>
                    </button>
                    <button class="act-icon" title="Source Control">
                        <i data-lucide="git-branch"></i>
                    </button>
                </div>
                <div class="act-group-bottom">
                    <button class="act-icon" onclick="openSettingsModal()" title="Editor Settings">
                        <i data-lucide="settings"></i>
                    </button>
                </div>
            </aside>

            <!-- Nested File & Folder Explorer Sidebar -->
            <div class="sidebar" id="sidebar">
                <div class="file-explorer">
                    <header class="explorer-header">
                        <span class="explorer-title">EXPLORER</span>
                        <div class="explorer-actions">
                            <i data-lucide="file-plus" class="add-btn" onclick="addNewRootItem('file')" title="New File in Root"></i>
                            <i data-lucide="folder-plus" class="add-btn" onclick="addNewRootItem('folder')" title="New Folder in Root"></i>
                            <i data-lucide="refresh-cw" class="add-btn" onclick="renderTree()" title="Refresh Tree"></i>
                        </div>
                    </header>
                    <div id="file-tree" class="tree-list"></div>
                </div>
            </div>

            <div class="resizer horizontal" id="resizer-side"></div>

            <!-- Main Code Area & Output -->
            <main class="main-content">
                <div class="top-row">
                    <!-- Monaco Editor Area -->
                    <section class="editor-area">
                        <div class="tab-bar" id="tab-bar">
                            <div class="tab active">
                                <i data-lucide="file-code" class="tab-icon"></i>
                                <span id="current-tab-name">index.html</span>
                            </div>
                        </div>
                        <div id="monaco-editor"></div>
                    </section>
                    
                    <div class="resizer horizontal" id="resizer-main"></div>

                    <!-- Webview Preview Panel -->
                    <section class="output-area" id="preview-frame-container">
                        <div class="pane-header">
                            <div class="pane-title">
                                <i data-lucide="globe"></i>
                                <span>LIVE PREVIEW</span>
                            </div>
                            <div class="pane-controls">
                                <i data-lucide="rotate-cw" onclick="refreshPreview()" class="pane-action-icon" title="Reload Webview"></i>
                                <i data-lucide="external-link" onclick="openPreviewNewTab()" class="pane-action-icon" title="Open in New Tab"></i>
                            </div>
                        </div>
                        <div class="iframe-wrapper">
                            <iframe id="preview-frame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
                        </div>
                    </section>
                </div>

                <div class="resizer vertical" id="resizer-term"></div>

                <!-- Interactive Shell Terminal -->
                <section class="terminal-pane" id="terminal-pane">
                    <div class="pane-header">
                        <div class="pane-title">
                            <i data-lucide="terminal"></i>
                            <span>INTERACTIVE SHELL</span>
                        </div>
                        <div class="pane-controls">
                            <i data-lucide="trash-2" onclick="clearTerminal()" class="pane-action-icon" title="Clear Console"></i>
                        </div>
                    </div>
                    <div id="terminal-container"></div>
                </section>
            </main>
        </div>

        <!-- Status Bar -->
        <footer class="status-bar">
            <div class="status-left">
                <span class="status-item"><i data-lucide="check-circle-2"></i> Ready</span>
                <span class="status-item" id="active-lang-status">HTML</span>
            </div>
            <div class="status-right">
                <span class="status-item">UTF-8</span>
                <span class="status-item" id="status-tab-size">Spaces: 4</span>
            </div>
        </footer>
    </div>

    <!-- Settings Modal Drawer -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i data-lucide="settings"></i> Editor Settings</h3>
                <i data-lucide="x" class="modal-close" onclick="closeSettingsModal()"></i>
            </div>
            <div class="modal-body">
                <div class="setting-row">
                    <label>Font Size (px)</label>
                    <input type="number" id="setting-font-size" value="14" min="10" max="30">
                </div>
                <div class="setting-row">
                    <label>Tab Size (Spaces)</label>
                    <select id="setting-tab-size">
                        <option value="2">2 Spaces</option>
                        <option value="4" selected>4 Spaces</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>Minimap View</label>
                    <input type="checkbox" id="setting-minimap">
                </div>
                <div class="setting-row">
                    <label>Word Wrap</label>
                    <input type="checkbox" id="setting-word-wrap" checked>
                </div>
            </div>
            <div class="modal-footer">
                <button class="save-btn" onclick="applySettings()">Apply Preferences</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
